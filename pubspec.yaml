name: flutterpractisetasks
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  http: ^1.6.0
  dio: ^5.4.0
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  fluttertoast: ^8.2.12
  go_router: ^17.3.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.2 #Mở webview/trình duyệt
  cached_network_image: ^3.4.1 # Load ảnh thumnail bài báo
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.2.0
  dio_smart_retry: ^7.0.1
  timezone: ^0.11.1
  geolocator: ^14.0.3
  permission_handler: ^12.0.3
  intl: ^0.20.3
  workmanager: ^0.9.0+3
  flutter_svg: ^2.3.0
  path_provider: ^2.1.6 
  csv: ^8.0.0
  share_plus: ^13.2.0
  device_info_plus: ^13.2.0
  open_filex: ^4.7.0
  image_picker: ^1.2.3
  geocoding: ^5.0.0
  video_player: ^2.11.1
  shimmer: ^3.0.0
  skeletonizer: ^2.1.3
  sqflite: ^2.4.2+1
  bloc_concurrency: ^0.3.0 # Để dùng transformer: droppable() trong bloc
  crypto: ^3.0.7
  uuid: ^4.6.0
  mime: ^2.0.0
  chewie: ^1.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
